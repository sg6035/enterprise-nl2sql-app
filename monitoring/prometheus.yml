global:
  scrape_interval: 15s
  external_labels:
    monitor: 'nl2sql-monitor'

scrape_configs:
  - job_name: 'nl2sql-api'
    static_configs:
      - targets: ['nl2sql-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']